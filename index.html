    const questions = [

    function normalizeTag(str) {
        if (!str) return "";
        return str.toLowerCase().replace(/[^а-яa-z0-9]/gi, '');
    }

    function recommendBook(answersObj) {
        let bestMatch = null;
        let maxScore = -1;
        for (let book of booksDB) {
            let score = 0;
            if (answersObj.mood && book.mood) {
                const normAnsMood = normalizeTag(answersObj.mood);
                const normBookMood = normalizeTag(book.mood);
                if (normAnsMood === normBookMood) score += 30;
                else if (normAnsMood.includes("радость") && normBookMood.includes("радость")) score += 20;
                else if (normAnsMood.includes("меланхолия") && normBookMood.includes("меланхолия")) score += 25;
                else if (normAnsMood.includes("авантюра") && (normBookMood.includes("авантюра") || normBookMood.includes("эпичность"))) score += 22;
                else if (normAnsMood.includes("уют") && normBookMood.includes("уют")) score += 24;
                else if (normAnsMood.includes("задумчивость") && (normBookMood.includes("задумчивость") || normBookMood.includes("бунт") || normBookMood.includes("скептицизм"))) score += 18;
            }
            if (answersObj.genre && book.genre) {
                let ansGenreNorm = normalizeTag(answersObj.genre);
                let bookGenreNorm = normalizeTag(book.genre);
                if (ansGenreNorm === bookGenreNorm) score += 25;
                else if (ansGenreNorm.includes("фантастика") && bookGenreNorm.includes("фантастика")) score += 20;
                else if (ansGenreNorm.includes("фэнтези") && bookGenreNorm.includes("фэнтези")) score += 20;
                else if (ansGenreNorm.includes("нонфикшн") && bookGenreNorm.includes("нонфикшн")) score += 23;
                else if (ansGenreNorm.includes("классика") && bookGenreNorm.includes("классика")) score += 22;
                else if (ansGenreNorm.includes("триллер") && bookGenreNorm.includes("триллер")) score += 22;
                else if (ansGenreNorm.includes("современнаяпроза") && (bookGenreNorm.includes("современнаяпроза") || bookGenreNorm.includes("роман"))) score += 18;
            }
            if (answersObj.length && book.length) {
                if (normalizeTag(answersObj.length) === normalizeTag(book.length)) score += 18;
            }
            if (answersObj.pace && book.pace) {
                if (normalizeTag(answersObj.pace) === normalizeTag(book.pace)) score += 17;
                else if (answersObj.pace === "быстрый" && book.pace === "размеренный") score += 5;
                else if (answersObj.pace === "размеренный" && book.pace === "быстрый") score += 3;
            }
            if (answersObj.vibe && book.vibe) {
                const vibeMap = {
                    "глубокий": ["глубокий", "интеллектуальный", "мысль", "мрачный", "пронзительный"],
                    "жизнеутверждающий": ["жизнеутверждающий", "волшебный", "человечный", "атмосферный"],
                    "захватывающий": ["захватывающий", "бунтарский", "волшебный"],
                    "познавательный": ["познавательный", "практичный"],
                    "лиричный": ["лиричный", "нежный", "атмосферный"]
                };
                let normalizedVibeAns = normalizeTag(answersObj.vibe);
                let normalizedVibeBook = normalizeTag(book.vibe);
                if (normalizedVibeAns === normalizedVibeBook) score += 20;
                else {
                    let match = false;
                    for (let [key, synonyms] of Object.entries(vibeMap)) {
                        if (normalizeTag(key) === normalizedVibeAns) {
                            if (synonyms.some(syn => normalizeTag(syn) === normalizedVibeBook)) { match = true; break; }
                        }
                    }
                    if (match) score += 15;
                }
            }
            if (score > maxScore) { maxScore = score; bestMatch = book; }
        }
        if (!bestMatch) bestMatch = booksDB[0];
        return bestMatch;
    }

        // Теперь отправляется только чистое название, например: "Дюна"
        const message = title; 
        const encodedMessage = encodeURIComponent(message);
        const telegramLink = `https://t.me/${botUsername}?text=${encodedMessage}`;
        window.open(telegramLink, '_blank');
    }

    function renderQuestion() {
        if (quizFinished) {
            const recommended = recommendBook(answers);
            quizContainer.innerHTML = `
                <div class="result-card">
                    <div class="book-emoji">${recommended.emoji || "📖"}</div>
                    <div class="book-title">${recommended.title}</div>
                    <div class="book-author">${recommended.author}</div>
                    <div class="book-desc">${recommended.desc}</div>
                    
                    <div style="margin-top: 24px; padding: 20px; background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); border-radius: 20px; border: 2px dashed #2AABEE; text-align: center; animation: fadeSlide 0.6s ease;">
                        <p style="margin: 0 0 16px 0; font-size: 1rem; color: #0c4a6e; font-weight: 700; line-height: 1.4;">
                            🎁 Отличный выбор!<br>
                            Получите <strong>персональную подборку из 5 лучших книг</strong> в этом жанре в Telegram абсолютно бесплатно!
                        </p>
                        <button class="telegram-btn" id="telegramBtn" style="margin: 0 auto; max-width: 400px;">
                            📱 Открыть бота и получить подборку
                        </button>
                    </div>
                    
                    <button class="reset-btn" id="resetQuizBtn">🔄 Пройти тест заново</button>
                </div>
            `;
            
            const telegramBtn = document.getElementById('telegramBtn');
            if (telegramBtn) {
                telegramBtn.addEventListener('click', () => {
                    openTelegramWithBook(recommended.title, recommended.author);
                });
            }

            const resetBtn = document.getElementById('resetQuizBtn');
            if (resetBtn) resetBtn.addEventListener('click', resetQuiz);
            return;
        }

        const q = questions[currentStep];
        const field = q.field;
        const currentAnswer = answers[field];

        let optionsHtml = '';
        q.options.forEach(opt => {
            const isSelected = (currentAnswer === opt.value);
            const selectedClass = isSelected ? 'selected' : '';
            optionsHtml += `
                <div class="option-btn ${selectedClass}" data-value="${opt.value}">
                    <span class="option-emoji">${opt.emoji}</span>
                    <span>${opt.label}</span>
                </div>
            `;
        });

        const showPrev = currentStep > 0;
        const nextBtnText = (currentStep === questions.length - 1) ? '📌 Узнать книгу' : 'Далее →';

        const html = `
            <div class="question-card">
                <div class="question-text">${q.text}</div>
                <div class="options-grid" id="optionsGrid">
                    ${optionsHtml}
                </div>
                <div class="nav-buttons">
                    ${showPrev ? '<button class="btn btn-secondary" id="prevBtn">← Назад</button>' : '<div></div>'}
                    <button class="btn btn-primary" id="nextBtn">${nextBtnText}</button>
                </div>
            </div>
        `;
        quizContainer.innerHTML = html;

        const optionDivs = document.querySelectorAll('.option-btn');
        optionDivs.forEach(btn => {
            btn.addEventListener('click', () => {
                answers[field] = btn.getAttribute('data-value');
                renderQuestion();
            });
        });

        const nextBtn = document.getElementById('nextBtn');
        const prevBtn = document.getElementById('prevBtn');
        if (nextBtn) {
            nextBtn.addEventListener('click', () => {
                if (!answers[field]) {
                    alert('Пожалуйста, выберите вариант ответа 😊');
                    return;
                }
                if (currentStep === questions.length - 1) {
                    quizFinished = true;
                    renderQuestion();
                    updateProgress(1);
                    stepCounterSpan.innerText = `Рекомендация`;
                    stepLabelSpan.innerText = 'Ваша книга';
                } else {
                    currentStep++;
                    updateProgress(currentStep / questions.length);
                    stepCounterSpan.innerText = `Вопрос ${currentStep+1} из ${questions.length}`;
                    stepLabelSpan.innerText = questions[currentStep].text.substring(0, 40);
                    renderQuestion();
                }
            });
        }
        if (prevBtn) {
            prevBtn.addEventListener('click', () => {
                currentStep--;
                updateProgress(currentStep / questions.length);
                stepCounterSpan.innerText = `Вопрос ${currentStep+1} из ${questions.length}`;
                stepLabelSpan.innerText = questions[currentStep].text.substring(0, 40);
                renderQuestion();
            });
        }
    }

    function updateProgress(percent) {
        let perc = Math.floor(percent * 100);
        if (quizFinished) perc = 100;
        progressFill.style.width = `${perc}%`;
    }

    function resetQuiz() {
        currentStep = 0;
        answers = { mood: null, genre: null, length: null, pace: null, vibe: null };
        quizFinished = false;
        updateProgress(0);
        stepCounterSpan.innerText = `Вопрос 1 из ${questions.length}`;
        stepLabelSpan.innerText = questions[0].text.substring(0, 40);
        renderQuestion();
    }

    function init() {
        updateProgress(0);
        stepCounterSpan.innerText = `Вопрос 1 из ${questions.length}`;
        stepLabelSpan.innerText = questions[0].text.substring(0, 40);
        renderQuestion();
    }

    init();
</script>
</body>
</html>
